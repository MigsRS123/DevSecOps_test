name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask

      - name: Start Flask app
        run: |
          cd app
          nohup python server.py > ../flask.log 2>&1 &
          echo "Waiting for app to start..."
          sleep 15
          curl -f http://localhost:8080/ || (cat ../flask.log && exit 1)
          echo "✅ App is running!"

      - name: Download and run ZAP directly
        run: |
          # Download do ZAP
          wget -q https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2.14.0_Linux.tar.gz
          tar -xzf ZAP_2.14.0_Linux.tar.gz
          cd ZAP_2.14.0
          
          # Inicia ZAP em background
          ./zap.sh -daemon -port 8081 -host 127.0.0.1 -config api.disablekey=true &
          ZAP_PID=$!
          sleep 20
          
          # Verifica se ZAP está rodando
          if curl -s http://localhost:8081/ > /dev/null; then
            echo "✅ ZAP is running"
          else
            echo "❌ ZAP failed to start"
            exit 1
          fi

          # Executa spider
          echo "🔍 Starting spider..."
          curl "http://localhost:8081/JSON/spider/action/scan/?url=http://localhost:8080&maxChildren=5"
          sleep 30
          
          # Executa active scan
          echo "🔎 Starting active scan..."
          curl "http://localhost:8081/JSON/ascan/action/scan/?url=http://localhost:8080&recurse=true"
          sleep 60
          
          # Gera relatórios
          echo "📄 Generating reports..."
          curl -s "http://localhost:8081/OTHER/core/other/htmlreport/" > ../zap_report.html
          curl -s "http://localhost:8081/JSON/core/view/alerts/?baseurl=http://localhost:8080" > ../zap_report.json
          
          # Para o ZAP
          kill $ZAP_PID
          echo "✅ ZAP scan completed"

      - name: Verify and display reports
        run: |
          echo "=== VERIFYING REPORTS ==="
          ls -la *.html *.json 2>/dev/null || echo "No reports found initially"
          
          # Garante que temos os relatórios
          if [ ! -f zap_report.html ]; then
            echo "❌ zap_report.html not found - creating empty report"
            echo "<html><body><h1>No ZAP report generated</h1></body></html>" > zap_report.html
          fi
          
          if [ ! -f zap_report.json ]; then
            echo "❌ zap_report.json not found - creating empty report"
            echo "[]" > zap_report.json
          fi
          
          echo "✅ Final files:"
          ls -la zap_report.*

      - name: Check for High and Medium risks
        run: |
          echo "🔒 Checking for High/Medium risks..."
          if [ -f zap_report.json ]; then
            # Análise simples com Python
            python << EOF
import json
import sys

try:
    with open('zap_report.json', 'r') as f:
        data = json.load(f)
    
    # Conta vulnerabilidades
    high_count = 0
    medium_count = 0
    
    if isinstance(data, list):
        alerts = data
    else:
        alerts = data.get('site', [{}])[0].get('alerts', [])
    
    for alert in alerts:
        risk = alert.get('risk', 'Informational')
        if risk == 'High':
            high_count += 1
        elif risk == 'Medium':
            medium_count += 1
    
    print(f"📊 SECURITY SCAN RESULTS:")
    print(f"   High risk vulnerabilities: {high_count}")
    print(f"   Medium risk vulnerabilities: {medium_count}")
    
    if high_count > 0 or medium_count > 0:
        print("❌ CRITICAL: High or Medium risk vulnerabilities detected!")
        print("Failing the pipeline for security reasons.")
        sys.exit(1)
    else:
        print("✅ No High or Medium risk vulnerabilities found.")
        
except Exception as e:
    print(f"❌ Error analyzing report: {e}")
    sys.exit(1)
EOF
          else
            echo "❌ No ZAP report found for analysis"
            exit 1
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            zap_report.html
            zap_report.json
            flask.log
          retention-days: 30