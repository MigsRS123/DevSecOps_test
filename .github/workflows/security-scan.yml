name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Flask app
        run: |
          cd app
          nohup python server.py > flask.log 2>&1 &
          echo "Waiting for app to start..."
          sleep 10
          curl -f http://localhost:8080/ || exit 1
          echo "App is running!"

      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Check for High and Medium risks
        run: |
          if [ -f zap_report.json ]; then
            # Instala jq para processar JSON
            sudo apt-get install -y jq
            
            # Conta vulnerabilidades High e Medium
            HIGH_COUNT=$(jq '[.site[0].alerts[] | select(.risk == "High")] | length' zap_report.json)
            MEDIUM_COUNT=$(jq '[.site[0].alerts[] | select(.risk == "Medium")] | length' zap_report.json)
            
            echo "=== SECURITY SCAN RESULTS ==="
            echo "High risk vulnerabilities: $HIGH_COUNT"
            echo "Medium risk vulnerabilities: $MEDIUM_COUNT"
            
            # Falha o pipeline se encontrar High ou Medium
            if [ $HIGH_COUNT -gt 0 ] || [ $MEDIUM_COUNT -gt 0 ]; then
              echo "❌ CRITICAL: High or Medium risk vulnerabilities detected!"
              echo "Failing the pipeline for security reasons."
              exit 1
            else
              echo "✅ No High or Medium risk vulnerabilities found."
            fi
          else
            echo "❌ No ZAP report generated"
            exit 1
          fi

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: |
            zap_report.html
            zap_report.json
          retention-days: 30