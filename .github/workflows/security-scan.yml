name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask

      - name: Start Flask app
        run: |
          cd app
          nohup python server.py > ../flask.log 2>&1 &
          echo "Waiting for app to start..."
          sleep 20
          
          # Verifica múltiplas vezes se a app está rodando
          for i in {1..5}; do
            if curl -s http://localhost:8080/ > /dev/null; then
              echo "✅ App is running! (attempt $i)"
              break
            else
              echo "⏳ Waiting for app... (attempt $i)"
              sleep 5
            fi
          done
          
          # Verificação final
          curl -f http://localhost:8080/ || (cat ../flask.log && exit 1)

      - name: Run ZAP with Docker
        run: |
          echo "🔒 Starting ZAP security scan..."
          
          # Executa ZAP via Docker com imagem correta do GHCR
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 \
            -J zap_report.json \
            -r zap_report.html \
            -a \
            -m 5
          
          echo "✅ ZAP scan completed!"

      - name: List all files
        run: |
          echo "📁 Files in workspace:"
          ls -la

      - name: Check reports
        run: |
          echo "🔍 Checking generated reports..."
          if [ -f zap_report.html ] && [ -f zap_report.json ]; then
            echo "✅ Both reports generated successfully!"
            echo "HTML size: $(wc -c < zap_report.html) bytes"
            echo "JSON size: $(wc -c < zap_report.json) bytes"
            
            # Mostra preview do conteúdo
            echo "--- HTML Preview (first 10 lines) ---"
            head -10 zap_report.html
            echo "--- JSON Preview ---"
            python -c "
            import json
            try:
                with open('zap_report.json', 'r') as f:
                    data = json.load(f)
                print(f'JSON keys: {list(data.keys())}')
                if 'site' in data:
                    alerts = data['site'][0].get('alerts', [])
                    print(f'Number of alerts: {len(alerts)}')
                    for alert in alerts[:3]:
                        print(f'  - {alert.get(\"name\")} (Risk: {alert.get(\"risk\")})')
            except Exception as e:
                print(f'Error reading JSON: {e}')
            "
                    else
                        echo "❌ Reports missing:"
                        [ -f zap_report.html ] || echo "  - zap_report.html missing"
                        [ -f zap_report.json ] || echo "  - zap_report.json missing"
                        exit 1
                    fi

      - name: Check for High/Medium vulnerabilities
        run: |
          echo "🔒 Checking for High/Medium vulnerabilities..."
          if [ -f zap_report.json ]; then
            python -c "
                    import json
                    import sys

                    try:
                        with open('zap_report.json', 'r') as f:
                            data = json.load(f)
                        
                        high_count = 0
                        medium_count = 0
                        
                        # Extrai alertas do JSON
                        if 'site' in data:
                            alerts = data['site'][0].get('alerts', [])
                        else:
                            alerts = []
                        
                        for alert in alerts:
                            risk = alert.get('risk', 'Informational')
                            if risk == 'High':
                                high_count += 1
                                print(f'🚨 HIGH: {alert.get(\"name\")}')
                            elif risk == 'Medium':
                                medium_count += 1
                                print(f'⚠️ MEDIUM: {alert.get(\"name\")}')
                        
                        print('')
                        print('📊 SECURITY SCAN SUMMARY:')
                        print(f'   High risk vulnerabilities: {high_count}')
                        print(f'   Medium risk vulnerabilities: {medium_count}')
                        print(f'   Total alerts: {len(alerts)}')
                        
                        if high_count > 0 or medium_count > 0:
                            print('❌ CRITICAL: High or Medium risk vulnerabilities detected!')
                            print('Failing the pipeline for security reasons.')
                            sys.exit(1)
                        else:
                            print('✅ No High or Medium risk vulnerabilities found.')
                            
                    except Exception as e:
                        print(f'❌ Error analyzing report: {e}')
                        sys.exit(1)
                    "
                            else
                                echo "❌ No ZAP report found for analysis"
                                exit 1
                            fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            zap_report.html
            zap_report.json
            flask.log
          retention-days: 30

      - name: Scan completed
        if: always()
        run: |
          echo "=========================================="
          echo "           SCAN COMPLETED!               "
          echo "=========================================="
          echo "📁 Reports available in Artifacts section"
          echo "🔒 Security check: ${{ job.status }}"
          echo "=========================================="