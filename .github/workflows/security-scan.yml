name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask

      - name: Start Flask app
        run: |
          cd app
          nohup python server.py > ../flask.log 2>&1 &
          sleep 15
          curl -f http://localhost:8080/ || exit 1
          echo "✅ App is running!"

      - name: Run ZAP Security Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a -J zap_report.json -r zap_report.html'

      - name: Simple Security Check
        run: |
          echo "🔍 Checking scan results..."
          if [ -f zap_report.json ]; then
            # Método SUPER SIMPLES - só verifica se o arquivo existe
            echo "✅ Scan completed - reports generated"
            echo "📊 Reports available for download in Artifacts"
          else
            echo "❌ Scan failed - no report generated"
            exit 1
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            zap_report.html
            zap_report.json
          retention-days: 30