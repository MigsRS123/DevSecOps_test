name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask

      - name: Start Flask app
        run: |
          cd app
          nohup python server.py > ../flask.log 2>&1 &
          echo "Waiting for app to start..."
          sleep 20
          
          # Verifica múltiplas vezes se a app está rodando
          for i in {1..5}; do
            if curl -s http://localhost:8080/ > /dev/null; then
              echo "✅ App is running! (attempt $i)"
              break
            else
              echo "⏳ Waiting for app... (attempt $i)"
              sleep 5
            fi
          done
          
          # Verificação final
          curl -f http://localhost:8080/ || (cat ../flask.log && exit 1)

      - name: Run ZAP with Docker (Fixed Network)
        run: |
          echo "🔒 Starting ZAP security scan..."
          
          # Obtém o IP do host
          HOST_IP=$(hostname -I | awk '{print $1}')
          echo "Host IP: $HOST_IP"
          
          # Executa ZAP via Docker com network do host
          docker run --rm \
            --network="host" \
            -v $(pwd):/zap/wrk/:rw \
            -u $(id -u):$(id -g) \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 \
            -J zap_report.json \
            -r zap_report.html \
            -a \
            -m 5
          
          echo "✅ ZAP scan completed!"

      - name: Check reports
        run: |
          echo "🔍 Checking generated reports..."
          if [ -f zap_report.html ] && [ -s zap_report.html ]; then
            echo "✅ HTML report generated: $(wc -c < zap_report.html) bytes"
          else
            echo "❌ HTML report missing or empty"
            exit 1
          fi
          
          if [ -f zap_report.json ] && [ -s zap_report.json ]; then
            echo "✅ JSON report generated: $(wc -c < zap_report.json) bytes"
          else
            echo "❌ JSON report missing or empty"
            exit 1
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            zap_report.html
            zap_report.json
          retention-days: 30